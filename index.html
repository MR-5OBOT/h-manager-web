<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>H-manager</title>
    <!-- Expo's default page, painted black so the 4 MB bundle loads without a white flash. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #000;
        color-scheme: dark;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Slim scrollbars: Chromium/Safari via the pseudo-elements (no arrow
         buttons), Firefox via the standard properties. */
      ::-webkit-scrollbar {
        width: 3px;
        height: 3px;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      ::-webkit-scrollbar-track,
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          scrollbar-color: #333 transparent;
        }
      }
    </style>
  <link rel="icon" href="/h-manager-web/favicon.ico"/></head>
